<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadMi</title>
  </head>
  <body>
    <main id="app" class="panel">
      <header class="header">
        <div class="brand">
          <div id="logoMark" class="logo-mark" aria-hidden="true">
            <img src="/icons/icon-48.png" alt="" />
          </div>
          <h1>ReadMi</h1>
          <p id="statusText">准备朗读</p>
        </div>
        <button id="openOptions" class="icon-button" title="设置" aria-label="设置">⚙</button>
      </header>

      <section class="controls" aria-label="朗读控制">
        <button id="readFull" class="primary">朗读全文</button>
        <button id="readSelection">朗读选中</button>
        <button id="readFromSelection">从选中处开始</button>
        <button id="readNextSegment">朗读下一段</button>
        <button id="stopReading">停止朗读</button>
        <button id="resumeReading">继续朗读</button>
      </section>

      <section class="field">
        <label for="voiceSelect">音色</label>
        <select id="voiceSelect"></select>
      </section>

      <section class="field">
        <label for="styleSelect">风格</label>
        <select id="styleSelect"></select>
      </section>

      <section class="field">
        <span>倍速</span>
        <div id="rateButtons" class="segmented"></div>
      </section>
    </main>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
